name: Build and test

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Ev '^(docs/|examples/|README\.md$|CHANGELOG\.md$)' || true)
          if [ -n "$CODE_FILES" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: build, lint and tests skipped."
          fi

      - name: Use Node.js
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint

      - name: Check format
        if: steps.changes.outputs.code == 'true'
        run: npm run format:check

      - name: Build TS
        if: steps.changes.outputs.code == 'true'
        run: npm run build:ts

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: npm test
